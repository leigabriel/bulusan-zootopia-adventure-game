name: Android release

# Every push builds a signed release APK, bumps the version by 0.1
# (1.0 -> 1.1 -> 1.2 ... 1.9 -> 2.0), publishes the APK as a GitHub Release and
# commits the new version back. Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# See "Signed Android releases" in README.md.
#
# The APK is also uploaded to a Cloudflare R2 bucket (S3 API), under a folder
# named after the branch, and every older APK in that folder is deleted so the
# bucket only keeps the latest build. Needs these repository secrets:
#   R2_ACCOUNT_ID         Cloudflare account id (the endpoint host prefix)
#   R2_ACCESS_KEY_ID      R2 API token access key id (Object Read & Write)
#   R2_SECRET_ACCESS_KEY  R2 API token secret access key
#   R2_BUCKET             bucket name
# Without them the upload is skipped with a warning; a failed upload never
# blocks the release or the version bump.

on:
  push:
    branches: [master, game-test]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch so two pushes can never take the same version.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The bump commit is pushed by this workflow; never build it again.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The changelog is built from the commit history since the last release.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. A signed release APK cannot be built without them (see README)."
            exit 1
          fi

      - name: Bump version
        id: version
        run: |
          version=$(node scripts/version.mjs bump)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build web app
        run: npm run build

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Create Android project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android-configure.mjs --require-signing

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed
        id: apk
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [[ "$apk" == *unsigned* ]]; then
            echo "::error::Gradle produced an unsigned APK: $apk"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          final="Bulusan Zootopia Adventure Game.apk"
          cp "$apk" "$final"
          echo "file=$final" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bulusan Zootopia Adventure Game ${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}${{ github.ref_name == 'master' && '' || format('-{0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          name: Bulusan Zootopia ${{ steps.version.outputs.name }}
          prerelease: ${{ github.ref_name != 'master' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}

      # Keeps only the newest APK per branch in the bucket. The new file is
      # uploaded and checked before anything old is removed, so a failed upload
      # never leaves the bucket empty.
      - name: Upload APK to Cloudflare R2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          APK_FILE: ${{ steps.apk.outputs.file }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets are not set, skipping the Cloudflare R2 upload."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${BRANCH}/"
          key="${prefix}Bulusan-Zootopia-Adventure-Game-${APP_VERSION}.apk"

          aws s3api put-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" \
            --key "$key" --body "$APK_FILE" \
            --content-type application/vnd.android.package-archive
          aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$key" > /dev/null
          echo "Uploaded $key"

          # Remove every other APK in this branch's folder.
          aws s3api list-objects-v2 --endpoint-url "$endpoint" --bucket "$R2_BUCKET" \
            --prefix "$prefix" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | grep -E '\.apk$' | grep -vxF "$key" \
            | while IFS= read -r old; do
                aws s3api delete-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$old"
                echo "Deleted $old"
              done || true

      # Last on purpose: a failed build must not use up a version number.
      - name: Commit the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/changelog.mjs release "${{ steps.version.outputs.name }}" "$(node -p "require('./version.json').versionCode")"
          git add version.json package.json CHANGELOG.md
          git commit -m "chore: release ${{ steps.version.outputs.name }} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          echo "::error::Could not push the version bump"
          exit 1
