name: Android release

# Every push builds a signed release APK, bumps the version by 0.1
# (1.0 -> 1.1 -> 1.2 ... 1.9 -> 2.0), publishes the APK as a GitHub Release and
# commits the new version back. Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# See "Signed Android releases" in README.md.

on:
  push:
    branches: [master, game-test]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch so two pushes can never take the same version.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The bump commit is pushed by this workflow; never build it again.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. A signed release APK cannot be built without them (see README)."
            exit 1
          fi

      - name: Bump version
        id: version
        run: |
          version=$(node scripts/version.mjs bump)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build web app
        run: npm run build

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Create Android project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android-configure.mjs --require-signing

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed
        id: apk
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [[ "$apk" == *unsigned* ]]; then
            echo "::error::Gradle produced an unsigned APK: $apk"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          final="bulusan-zootopia-v${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$final"
          echo "file=$final" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}${{ github.ref_name == 'master' && '' || format('-{0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          name: Bulusan Zootopia ${{ steps.version.outputs.name }}
          prerelease: ${{ github.ref_name != 'master' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}

      # Last on purpose: a failed build must not use up a version number.
      - name: Commit the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json package.json
          git commit -m "chore: release ${{ steps.version.outputs.name }} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          echo "::error::Could not push the version bump"
          exit 1
